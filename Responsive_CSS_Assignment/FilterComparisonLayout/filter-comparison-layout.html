<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>

<body>
  <section class="comparison">
    <h1>Before & After Filter Comparison</h1>
    <div class="image-container">
      <div class="image-box">
        <img src="https://picsum.photos/id/1015/600/400" alt="Original Image">
        <p class="caption">Original Image</p>
      </div>
      <div class="image-box filtered">
        <img src="https://picsum.photos/id/1015/600/400" alt="Filtered Image">
        <p class="caption">Filtered Image (Brightness + Contrast)</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 Filter Comparison Layout | Designed by <strong>Ishendra Rai</strong></p>
  </footer>
</body>

</html>
