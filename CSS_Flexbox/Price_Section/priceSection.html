<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>
    <link rel="stylesheet" href="priceSection.css">
</head>
<body>
    <section class="pricing-section">
        <h1 class="title">Choose Your Plan</h1>

        <div class="pricing-container">
            <div class="card">
                <h2>Basic</h2>
                <p class="price">₹1000<span>/mo</span></p>
                <ul>
                    <li>✔️ 5 Projects</li>
                    <li>✔️ 10GB Storage</li>
                    <li>✔️ Email Support</li>
                </ul>
                <button>Get Started</button>
            </div>

            <div class="card featured">
                <h2>Pro</h2>
                <p class="price">₹2500<span>/mo</span></p>
                <ul>
                    <li>✔️ 20 Projects</li>
                    <li>✔️ 100GB Storage</li>
                    <li>✔️ Priority Support</li>
                </ul>
                <button>Choose Plan</button>
            </div>

            <div class="card">
                <h2>Premium</h2>
                <p class="price">₹5000<span>/mo</span></p>
                <ul>
                    <li>✔️ Unlimited Projects</li>
                    <li>✔️ 1TB Storage</li>
                    <li>✔️ 24/7 Support</li>
                </ul>
                <button>Subscribe</button>
            </div>
        </div>
    </section>
</body>
</html>
