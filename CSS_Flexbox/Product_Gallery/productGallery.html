<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Gallery</title>
    <link rel="stylesheet" href="productGallery.css">
</head>

<body>
    <header>
        <h1 class="title">🛍️ Featured Products</h1>
    </header>

    <section class="gallery">
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtrypqkM6xtfRVXc8ScnhmJa03jtrGHmZVlA&s" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p class="price">₹3000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://cdn.shopify.com/s/files/1/0057/8938/4802/files/Rockerz_650_pp_renders_main_banner.124.png?v=1740735495" alt="Wireless Headphones">
            <h2>Wireless Headphones</h2>
            <p class="price">₹7000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1589003077984-894e133dabab?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8Ymx1ZXRvb3RoJTIwc3BlYWtlcnxlbnwwfHwwfHx8MA%3D%3D&fm=jpg&q=60&w=3000" alt="Bluetooth Speaker">
            <h2>Bluetooth Speaker</h2>
            <p class="price">₹4500</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://www.jiomart.com/images/product/original/rvtrhnivcx/rpm-euro-games-usb-wireless-gaming-mouse-rechargeable-500-mah-battery-dpi-upto-3200-6-color-rgb-lights-rubber-coated-mice-black-product-images-orvtrhnivcx-p594809527-0-202210261818.jpg?im=Resize=(420,420)" alt="Wireless Mouse">
            <h2>Wireless Mouse</h2>
            <p class="price">₹1200</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2022/04/rgb-lit-gaming-mechanical-keyboard.jpg" alt="Gaming Keyboard">
            <h2>Gaming Keyboard</h2>
            <p class="price">₹6800</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2FNCOcvvXhGvLBiQoDDADJXYeL8Osdnjs6A&s" alt="DSLR Camera">
            <h2>DSLR Camera</h2>
            <p class="price">₹5000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVA3ikdxca1KCCIkYn2WtNMklV7EmqrzG1Dg&s" alt="Power Bank">
            <h2>Power Bank</h2>
            <p class="price">₹800</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmIjETBxCOTbTbc30fZOZcODhmCi9wJ51X1Q&s" alt="Smart Glasses">
            <h2>Smart Glasses</h2>
            <p class="price">₹2600</p>
            <button>Buy Now</button>
        </div>
    </section>

</html>
