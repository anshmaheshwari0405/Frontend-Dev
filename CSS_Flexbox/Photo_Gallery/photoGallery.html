<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="photoGallery.css">
</head>
<body>
  <header>
    <h1 class="title">📸 My Photo Gallery</h1>
    <p class="subtitle">A collection of my favorite moments</p>
  </header>

  <section class="gallery">
    <figure>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTW8LN2uwXA6cob3aU-nLz05fyuosF50rm2Q&s" alt="Nature">
      <figcaption>Peaceful Forest</figcaption>
    </figure>

    <figure>
      <img src="https://media.istockphoto.com/id/1069539210/photo/fantastic-autumn-sunset-of-hintersee-lake.jpg?s=612x612&w=0&k=20&c=oqKJzUgnjNQi-nSJpAxouNli_Xl6nY7KwLBjArXr_GE=" alt="Mountain">
      <figcaption>Majestic Mountains</figcaption>
    </figure>

    <figure>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0CguAw54iCisrk85HEk6vVq9SVPHIkva4SQ&s" alt="City">
      <figcaption>City Lights</figcaption>
    </figure>

    <figure>
      <img src="https://thumbs.dreamstime.com/b/sunny-beach-warm-blue-waters-high-quality-photo-306168182.jpg" alt="Beach">
      <figcaption>Sunny Beach</figcaption>
    </figure>

    <figure>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvuEbFE18_I6OOri9nMYbJ4qpEBb_pmHSu3Q&s" alt="River">
      <figcaption>Flowing River</figcaption>
    </figure>

    <figure>
      <img src="https://img.freepik.com/free-photo/beautiful-green-park_1417-1449.jpg" alt="Flowers">
      <figcaption>Blooming Garden</figcaption>
    </figure>

    <figure>
      <img src="https://as2.ftcdn.net/jpg/04/44/59/91/1000_F_444599131_VsghiX0rpHuvettNlAgjGeujVMNwgPeR.jpg" alt="Desert">
      <figcaption>Golden Desert</figcaption>
    </figure>

    <figure>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxBROrQLiPgdEBAcnksBEcGO-UzZq-4PPZPQ&s" alt="Snow">
      <figcaption>Winter Wonderland</figcaption>
    </figure>
  </section>

  <footer>
    <p>© 2025 Ishendra Rai | All Rights Reserved </p>
  </footer>
</body>
</html>
